<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>JSON reflow demo</title>
    <link rel="stylesheet" href="./style.css" />
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.6.2/core.css" />
    <script type="module" src="https://pyscript.net/releases/2026.6.2/core.js"></script>
</head>

<body>

    <div id="header">
        <h1>
            <a href="https://github.com/soxofaan/jsonreflow">JSON Reflow</a> demo
        </h1>
    </div>

    <div id="toolbar">
        <div>
            <label for="indent-select">Indentation:</label>
            <select id="indent-select">
                <option value="0">0 spaces</option>
                <option value="2" selected>2 spaces</option>
                <option value="4">4 spaces</option>
                <option value="8">8 spaces</option>
            </select>
        </div>
        <div>
            <label for="max-width-select">Max width:</label>
            <select id="max-width-select">
                <option value="20">20 chars</option>
                <option value="40">40 chars</option>
                <option value="80" selected>80 chars</option>
                <option value="120">120 chars</option>
            </select>
        </div>
    </div>

    <div id="text-panes">
        <div class="text-pane" id="input-pane">
            <div class="pane-title">
                Input JSON
                <span id="input-stats" class="pane-stats"></span>
            </div>
            <textarea id="input-json">loading ...</textarea>
        </div>

        <div class="text-pane" id="output-pane">
            <div class="pane-title">
                Reflowed JSON
                <span id="output-stats" class="pane-stats"></span>
                <button id="copy-output-button" type="button" class="pane-action-button" title="Copy reflowed JSON to clipboard" disabled>Copy</button>
            </div>
            <div id="output-error"></div>
            <textarea id="output-json" readonly>loading ...</textarea>
        </div>
    </div>

    <div id="about">
        🐍
        Powered by Python package <a href="https://github.com/soxofaan/jsonreflow">jsonreflow</a>
        <span class="jsonreflow-version"></span>.
        Running in the browser using <a href="https://pyscript.net">PyScript</a>.
    </div>

    <script type="py" config="./pyscript-config.json" src="./main.py"></script>
</body>

</html>
